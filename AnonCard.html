        function getUserData() {
            const user = tg.initDataUnsafe?.user;
            if (user) {
                // Если есть username в Telegram, используем его, иначе формируем из имени
                return user.username ? @${user.username} : 
                       user.first_name ? @${user.first_name.toLowerCase()}${user.last_name ? '_' + user.last_name.toLowerCase() : ''} : 
                       '@username';
            }
            return '@username'; // Если нет данных, показываем стандартный
        }

        // Функция для отправки данных в бот
        function sendData(action) {
            const data = {
                action: action,
                timestamp: new Date().toISOString(),
                username: getUserData().replace('@', '')
            };
            
            // Отправляем данные обратно в бот
            tg.sendData(JSON.stringify(data));
            
            // Показываем всплывающее уведомление (опционально)
            tg.HapticFeedback.impactOccurred('light');
        }

        // Рендерим интерфейс
        function renderAnonCard() {
            const app = document.getElementById('app');

            // Заголовок
            const titleDiv = document.createElement('div');
            titleDiv.className = 'title';
            const h1 = document.createElement('h1');
            h1.textContent = 'AnonCard';
            titleDiv.appendChild(h1);

            // Карта с динамическим username
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';
            const usernameDiv = document.createElement('div');
            usernameDiv.className = 'username';
            usernameDiv.textContent = getUserData(); // Подставляем данные из Telegram
            cardDiv.appendChild(usernameDiv);

            // Лимит
            const limitWrapper = document.createElement('div');
            limitWrapper.style.textAlign = 'center';
            const limitDiv = document.createElement('div');
            limitDiv.className = 'limit';
            limitDiv.textContent = 'Лимит: 30$/30$';
            limitWrapper.appendChild(limitDiv);

            // Кнопки с обработчиками
            const buttonsDiv = document.createElement('div');
            buttonsDiv.className = 'buttons';

            const btnMain = document.createElement('div');
            btnMain.className = 'btn primary'; // Главная — основная кнопка
            btnMain.textContent = 'Главная';
            btnMain.onclick = () => sendData('home');

            const btnTrans = document.createElement('div');
            btnTrans.className = 'btn';
            btnTrans.textContent = 'Переводы';
            btnTrans.onclick = () => sendData('transfers');

            buttonsDiv.appendChild(btnMain);
            buttonsDiv.appendChild(btnTrans);

            // Футер
            const footer = document.createElement('div');
            footer.className = 'footer';
            footer.textContent = 'anoncard • secure';

            // Сборка
            app.innerHTML = '';
            app.appendChild(titleDiv);
            app.appendChild(cardDiv);
            app.appendChild(limitWrapper);
            app.appendChild(buttonsDiv);
            app.appendChild(footer);
        }

        // Запускаем при загрузке
        renderAnonCard();

        // Опционально: обрабатываем изменение темы
        tg.onEvent('themeChanged', function() {
            // Можно обновить цвета, но они и так через CSS переменные подтянутся
            console.log('Theme changed');
        });
    </script>
